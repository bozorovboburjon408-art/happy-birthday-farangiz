    <text x="150" y="135" font-size="54" text-anchor="middle">🌸</text>

    <text x="150" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#7b2cbf" text-anchor="middle">QUVNOQ ONLAR</text>
    <text x="150" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#888" text-anchor="middle">Beg'ubor va Go'zal Xotira 💖</text>
    <text x="150" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9d4edd" text-anchor="middle">📸 Surat joyi (farangiz2.jpg)</text>

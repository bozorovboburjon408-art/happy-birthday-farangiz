<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="99%" stop-color="#fecfef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#bg1)"/>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="60" fill="white" opacity="0.2"/>
  <circle cx="520" cy="480" r="90" fill="white" opacity="0.15"/>
  <circle cx="480" cy="120" r="40" fill="#fff" opacity="0.25"/>

  <!-- Center Card Illustration -->
  <g transform="translate(150, 130)" filter="url(#shadow)">
    <!-- Frame -->
    <rect width="300" height="340" rx="20" fill="white" opacity="0.9"/>
    <!-- Avatar / Girl Icon -->
    <circle cx="150" cy="120" r="65" fill="#ffd1dc"/>
    <!-- Crown -->
    <path d="M120 70 L135 90 L150 65 L165 90 L180 70 L180 100 L120 100 Z" fill="#ffb703"/>
    <circle cx="120" cy="68" r="4" fill="#ff5e8e"/>
    <circle cx="150" cy="63" r="5" fill="#ff5e8e"/>
    <circle cx="180" cy="68" r="4" fill="#ff5e8e"/>
    <!-- Hair & Face -->
    <circle cx="150" cy="130" r="45" fill="#ffe0bd"/>
    <!-- Smile & Eyes -->
    <circle cx="138" cy="125" r="4" fill="#333"/>
    <circle cx="162" cy="125" r="4" fill="#333"/>
    <path d="M140 142 Q150 155 160 142" stroke="#e05780" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="132" cy="135" r="6" fill="#ff8fa3" opacity="0.6"/>
    <circle cx="168" cy="135" r="6" fill="#ff8fa3" opacity="0.6"/>

    <!-- Text -->
    <text x="150" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#ff4d6d" text-anchor="middle">FARANGIZ</text>
    <text x="150" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#888" text-anchor="middle">Samimiy Tabassum Egasi ✨</text>
    <text x="150" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ff8fa3" text-anchor="middle">📸 Surat joyi (farangiz1.jpg)</text>
  </g>
</svg>
